<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SEÑAS — Launch Ad</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ease-spring: cubic-bezier(.2, 1.5, .4, 1);
      --ease-apple: cubic-bezier(.25, .8, .25, 1)
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html,
    body {
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif
    }

    body {
      display: grid;
      place-items: center
    }

    #stage {
      container-type: size;
      position: relative;
      width: min(100vw, 177.78vh);
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #000;
      color: #fff
    }

    .s {
      position: absolute;
      inset: 0;
      overflow: hidden;
      perspective: 110cqw;
      perspective-origin: 50% 45%
    }

    .cam,
    .wl {
      position: absolute;
      inset: 0
    }

    .cam {
      transform-style: preserve-3d
    }

    .wl {
      z-index: 30;
      pointer-events: none
    }

    .b-lilac {
      background: radial-gradient(ellipse at 50% 125%, #d6aef6, #efe3fb 42%, #fbf9ff 78%)
    }

    .b-night {
      background: radial-gradient(ellipse at 70% 30%, #42308a, #1a1040 55%, #0a0620)
    }

    .b-blue {
      background: radial-gradient(ellipse at 30% 20%, #2f86ff, #0f47b8 55%, #04215f)
    }

    .b-gold {
      background: radial-gradient(ellipse at 30% 30%, #ffd45c, #fbab1c 60%, #e8890c)
    }

    .b-coral {
      background: radial-gradient(ellipse at 30% 30%, #ff9a8b, #ff5e7e 60%, #d7385e)
    }

    .b-sky {
      background: radial-gradient(ellipse at 50% 110%, #a9d4ff, #e8f3ff 60%, #fff)
    }

    .b-night::after,
    .b-blue::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .06) 1px, transparent 1px);
      background-size: 6cqw 6cqw;
      -webkit-mask-image: radial-gradient(circle at 50% 40%, #000, transparent 75%);
      mask-image: radial-gradient(circle at 50% 40%, #000, transparent 75%)
    }

    .bl {
      position: absolute;
      border-radius: 50%;
      filter: blur(5cqw);
      animation: drift 7s ease-in-out infinite alternate
    }

    @keyframes drift {
      to {
        transform: translate(5cqw, 3cqw) scale(1.2)
      }
    }

    .sq {
      position: absolute;
      background: rgba(255, 255, 255, .14);
      animation: fl2 linear infinite
    }

    @keyframes fl2 {
      from {
        transform: translateY(70cqw) rotate(0)
      }

      to {
        transform: translateY(-12cqw) rotate(360deg)
      }
    }

    .wd {
      position: absolute;
      translate: -50% -50%;
      font-weight: 800;
      letter-spacing: -.035em;
      line-height: 1.25;
      padding: .05em .1em .24em;
      white-space: nowrap;
      text-align: center
    }

    .wd.m {
      overflow: hidden
    }

    .wd i {
      display: inline-block;
      font-style: normal
    }

    .c-ink {
      color: #0d0f1f
    }

    .c-w {
      color: #fff;
      text-shadow: 0 .4cqw 2cqw rgba(0, 0, 0, .25)
    }

    .c-gold {
      color: #fbbf24;
      text-shadow: 0 .4cqw 2cqw rgba(120, 60, 0, .3)
    }

    .c-blue {
      color: #2f6be8
    }

    .c-g,
    .c-gb {
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text
    }

    .c-g {
      background-image: linear-gradient(90deg, #b08af0, #f472b6)
    }

    .c-gb {
      background-image: linear-gradient(90deg, #4f8cff, #a06af0)
    }

    @keyframes slam {
      from {
        opacity: 0;
        transform: scale(2.6) rotate(-5deg);
        filter: blur(1.2cqw)
      }
    }

    @keyframes pop {
      0% {
        opacity: 0;
        transform: scale(0)
      }

      70% {
        transform: scale(1.14)
      }
    }

    @keyframes drop {
      0% {
        opacity: 0;
        transform: translateY(-45cqw)
      }

      60% {
        opacity: 1;
        transform: translateY(2cqw)
      }

      80% {
        transform: translateY(-1cqw)
      }
    }

    @keyframes flip {
      from {
        opacity: 0;
        transform: perspective(60cqw) rotateX(-90deg)
      }
    }

    @keyframes zoom {
      from {
        opacity: 0;
        transform: scale(.25);
        filter: blur(1cqw)
      }
    }

    @keyframes wipe {
      from {
        clip-path: inset(0 100% 0 0)
      }
    }

    @keyframes rise {
      from {
        transform: translateY(115%)
      }
    }

    @keyframes out {
      to {
        opacity: 0;
        transform: scale(1.1) translateY(-1cqw);
        filter: blur(.6cqw)
      }
    }

    @keyframes dr {
      to {
        stroke-dashoffset: 0
      }
    }

    .dv {
      position: absolute;
      translate: -50% -50%;
      transform-style: preserve-3d;
      z-index: 10
    }

    .dv .l,
    .dv .f {
      position: absolute;
      inset: 0;
      border-radius: var(--r);
      background: #10131f
    }

    .dv .f {
      overflow: hidden;
      border: .45cqw solid #0b0c14;
      background: #fff;
      box-shadow: 0 0 5cqw rgba(110, 150, 255, .5)
    }

    .dv img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .dv.gr img {
      filter: grayscale(1) brightness(.85)
    }

    .dv .f::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, rgba(255, 255, 255, .4), transparent 38%, transparent 65%, rgba(255, 255, 255, .1))
    }

    .cf {
      position: absolute;
      top: -3cqw;
      z-index: 40;
      animation: cfd linear forwards
    }

    @keyframes cfd {
      to {
        transform: translateY(62cqw) rotate(720deg)
      }
    }

    /* ===== FLOATING UI CARDS (exact app/dashboard components) ===== */
    .fl {
      position: absolute;
      z-index: 8;
      transform-style: preserve-3d;
      opacity: 0;
      pointer-events: none
    }

    .on .fl {
      animation: fl-in 1s var(--ease-spring) both, fl-bob 4.6s ease-in-out infinite alternate;
      animation-delay: var(--d, 1s), calc(var(--d, 1s) + 1s)
    }

    @keyframes fl-in {
      from {
        opacity: 0;
        transform: translateZ(calc(var(--z, 5cqw) - 9cqw)) translateY(4cqw) scale(.8)
      }

      to {
        opacity: 1;
        transform: translateZ(var(--z, 5cqw))
      }
    }

    @keyframes fl-bob {
      from {
        translate: 0 .6cqw
      }

      to {
        translate: 0 -1cqw
      }
    }

    .ui {
      width: var(--w, 18cqw);
      position: relative;
      background: #fff;
      border-radius: 1.3cqw;
      padding: 1.1cqw 1.3cqw;
      color: #0f2a6b;
      font-family: 'Plus Jakarta Sans', 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1cqw;
      line-height: 1.25;
      box-shadow: 0 2.4cqw 4.8cqw rgba(5, 15, 60, .4), 0 0 0 .1cqw rgba(255, 255, 255, .8), inset 0 0 0 .1cqw rgba(120, 150, 230, .22);
      transform: rotateY(var(--ry, -14deg)) rotateX(var(--rx, 5deg));
      scale: var(--sc, 1);
      transform-origin: 50% 0;
      text-align: left
    }

    .ui::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(120deg, rgba(255, 255, 255, .55), transparent 42%);
      pointer-events: none
    }

    .ui.gold {
      background: linear-gradient(135deg, #fcd34d, #f59e0b);
      color: #3b2300
    }

    .ui.blue {
      background: linear-gradient(135deg, #2f6be8, #1d4ed8);
      color: #fff
    }

    .ui.or {
      background: linear-gradient(135deg, #fdc43f, #fb9a1d);
      color: #fff
    }

    .ui.te {
      background: linear-gradient(135deg, #34c3b4, #0e9a8a);
      color: #fff
    }

    .u-row {
      display: flex;
      align-items: center;
      gap: .7cqw
    }

    .u-sp {
      justify-content: space-between
    }

    .u-lab {
      font-size: .85cqw;
      color: #64748b;
      font-weight: 700
    }

    .ui.blue .u-lab,
    .ui.or .u-lab,
    .ui.te .u-lab {
      color: rgba(255, 255, 255, .85)
    }

    .ui.gold .u-lab {
      color: #78350f
    }

    .u-big {
      font-family: 'Baloo 2', sans-serif;
      font-size: 2.3cqw;
      line-height: 1.05;
      font-weight: 800
    }

    .u-bar {
      height: .55cqw;
      border-radius: 1cqw;
      background: #e2e8f0;
      overflow: hidden;
      margin: .4cqw 0
    }

    .u-bar i {
      display: block;
      height: 100%;
      width: var(--p);
      border-radius: 1cqw;
      background: var(--c, #2f6be8)
    }

    .on .u-bar i {
      animation: barg 1.4s var(--ease-apple) both;
      animation-delay: calc(var(--d, 1s) + .7s)
    }

    @keyframes barg {
      from {
        width: 0
      }
    }

    .u-pill {
      display: inline-block;
      padding: .25cqw .8cqw;
      border-radius: 2cqw;
      font-size: .72cqw;
      letter-spacing: .05em;
      font-weight: 800
    }

    .u-ico {
      width: 2.3cqw;
      height: 2.3cqw;
      flex: none;
      border-radius: .8cqw;
      background: #14307a;
      display: grid;
      place-items: center
    }

    .u-ico b {
      width: .95cqw;
      height: .95cqw;
      border: .2cqw solid #fff;
      border-radius: 50%
    }

    .u-ring {
      width: 3.8cqw;
      height: 3.8cqw;
      flex: none;
      border-radius: 50%;
      border: .5cqw solid #2d6fd6;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: .9cqw
    }

    .u-av {
      width: 2.6cqw;
      height: 2.6cqw;
      flex: none;
      border-radius: 50%;
      background: #14307a;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: .9cqw
    }

    .u-btn {
      flex: 1;
      text-align: center;
      padding: .55cqw;
      border-radius: 2cqw;
      font-size: .9cqw
    }

    .u-seg {
      display: flex;
      gap: .3cqw;
      margin: .5cqw 0 1cqw
    }

    .u-seg i {
      flex: 1;
      height: .4cqw;
      border-radius: 1cqw;
      background: #dbe3ef
    }

    .u-seg i:first-child {
      background: #2f6be8
    }

    .fl {
      z-index: 20
    }

    @keyframes fl-in {
      from {
        opacity: 0;
        transform: translate(var(--fx, 0cqw), var(--fy, 3cqw)) scale(.3)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .cl {
      position: absolute;
      inset: 0;
      z-index: 25;
      pointer-events: none
    }

    .ui {
      translate: -50% -50%;
      transform-origin: 50% 50%;
      transform: perspective(70cqw) rotateY(var(--ry, -14deg)) rotateX(var(--rx, 5deg))
    }

    #ui {
      position: absolute;
      inset: 0;
      z-index: 99;
      display: grid;
      place-items: center;
      background: rgba(5, 6, 24, .94);
      cursor: pointer;
      transition: opacity .4s;
      text-align: center
    }

    #ui.hide {
      opacity: 0;
      pointer-events: none
    }

    #ui h1 {
      font: 800 6cqw 'Baloo 2';
      color: #fbbf24
    }

    #ui p {
      font-size: 1.6cqw;
      color: #a9b8ff;
      margin: .6cqw 0 2cqw
    }

    #ui button {
      font: 800 2.4cqw 'Baloo 2';
      background: #fbbf24;
      color: #0d1f5c;
      border: 0;
      border-radius: 6cqw;
      padding: 1.1cqw 4cqw;
      cursor: pointer
    }

    /* ===== CONTROLS BAR ===== */
    #stage.is-paused,
    #stage.is-paused * {
      animation-play-state: paused !important;
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3.6cqw;
      z-index: 98;
      display: flex;
      align-items: center;
      gap: .6cqw;
      padding: 0 1.2cqw;
      background: linear-gradient(to top, rgba(5,6,24,.85) 60%, transparent);
      backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity .3s
    }
    #controls:hover,
    #stage:not(.playing) #controls,
    #stage.is-paused #controls { opacity: 1 }
    #stage.playing:hover #controls { opacity: 1 }

    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #fff;
      display: grid;
      place-items: center;
      padding: .3cqw;
      border-radius: .6cqw;
      transition: background .2s;
      flex-shrink: 0
    }
    .ctrl-btn:hover { background: rgba(255,255,255,.15) }
    .ctrl-btn svg { width: 1.5cqw; height: 1.5cqw; fill: currentColor }

    #prog-wrap {
      flex: 1;
      height: 1.8cqw;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative
    }
    #prog-track {
      width: 100%;
      height: .35cqw;
      background: rgba(255,255,255,.25);
      border-radius: 1cqw;
      position: relative;
      overflow: hidden;
      transition: height .15s
    }
    #prog-wrap:hover #prog-track { height: .55cqw }
    #prog-fill {
      height: 100%;
      width: 0;
      background: #fbbf24;
      border-radius: 1cqw;
      pointer-events: none
    }

    #mute {
      background: none;
      border: none;
      cursor: pointer;
      color: #fff;
      display: grid;
      place-items: center;
      padding: .3cqw;
      border-radius: .6cqw;
      transition: background .2s;
      flex-shrink: 0
    }
    #mute:hover { background: rgba(255,255,255,.15) }
    #mute svg { width: 1.5cqw; height: 1.5cqw; fill: currentColor }

    #fs-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #fff;
      display: grid;
      place-items: center;
      padding: .3cqw;
      border-radius: .6cqw;
      transition: background .2s;
      flex-shrink: 0
    }
    #fs-btn:hover { background: rgba(255,255,255,.15) }
    #fs-btn svg { width: 1.5cqw; height: 1.5cqw; fill: currentColor }
  </style>
</head>

<body>
  <div id="stage">
    <div id="scenes"></div>
    <!-- CONTROLS BAR -->
    <div id="controls">
      <!-- Restart -->
      <button class="ctrl-btn" id="restart-btn" title="Restart (0)">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      </button>
      <!-- Play/Pause -->
      <button class="ctrl-btn" id="playpause-btn" title="Play / Pause (Space)">
        <svg id="pp-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <!-- Progress bar -->
      <div id="prog-wrap" title="Seek">
        <div id="prog-track"><div id="prog-fill"></div></div>
      </div>
      <!-- Mute -->
      <button id="mute" title="Toggle Music">
        <svg id="mute-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>
      <!-- Fullscreen -->
      <button id="fs-btn" title="Fullscreen">
        <svg id="fs-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
    <div id="ui">
      <div>
        <h1>SEÑAS</h1>
        <p>Launch ad · about 1 minute · sound on</p><button id="go">Play the ad</button>
      </div>
    </div>
  </div>
  <script>
    /* ===== MEDIA: replace paths with your images or .mp4 files ===== */
    const A = { "dash": "assets/dash.jpg", "lessons": "assets/lessons.png", "students": "assets/students.png", "home": "assets/home.jpg", "gest": "assets/gest.jpg", "quiz": "assets/quiz.jpg", "det": "assets/det.jpg", "res": "assets/res.jpg", "lead": "assets/lead.jpg", "cert": "assets/cert.jpg", "ach": "assets/ach.jpg", "chal": "assets/chal.jpg", "ana": "assets/ana.jpg", "noti": "assets/noti.jpg", "senya": "assets/senya.jpg", "q1": "assets/q1.jpg", "q2": "assets/q2.jpg", "site": "assets/site.jpg", "dl": "assets/welcome.PNG" };
    /* ===== FLOATING UI CARD TEMPLATES (edit text/numbers here) ===== */
    const row = (a, b) => `<div class="u-row u-sp"><span>${a}</span><span class="u-lab">${b}</span></div>`;
    const kpi = (t, v, s) => `<div class="u-row"><div class="u-ico"><b></b></div><span style="font-size:1.1cqw">${t}</span></div><div class="u-big" style="margin:.5cqw 0 .1cqw">${v}</div><div class="u-lab">${s}</div>`;
    const stu = (i, n, l, c, g, x, p) => `<div class="u-row" style="margin:.5cqw 0"><div class="u-av">${i}</div><div style="flex:1"><div class="u-row"><span style="font-size:1.05cqw">${n}</span><span class="u-pill" style="background:${c};color:#1e3a8a">${l}</span></div><div class="u-row"><span class="u-lab">${g}</span><div class="u-bar" style="flex:1"><i style="--p:${p}"></i></div><span style="color:#f59e0b;font-size:.8cqw">${x}</span></div></div></div>`;
    const les = (n, s, p) => `<div class="u-lab" style="color:#14307a;font-size:1.1cqw">${n}</div><div class="u-bar" style="margin:.8cqw 0"><i style="--p:${p};--c:#14307a"></i></div><div class="u-lab" style="color:#2f6be8">${s}</div>`;
    const T = {
      xp: () => `<div class="u-row" style="gap:1cqw"><div class="u-ring">100%</div><div style="flex:1"><div class="u-row u-sp"><span style="font-size:1.2cqw">Total XP</span><span class="u-pill" style="background:#2563eb;color:#fff">LEVEL 10</span></div><div class="u-big" style="color:#2563eb">8108 <small style="font-size:1cqw">XP</small></div><div class="u-bar"><i style="--p:100%;--c:#fbbf24"></i></div><div class="u-lab">Advanced · Max level reached</div></div></div><div style="border-top:.1cqw solid #e2e8f0;margin:.8cqw 0"></div>${row("Today's Goal", "30 / 100 XP")}<div class="u-bar"><i style="--p:30%;--c:#fbbf24"></i></div>`,
      lesson: () => `<div class="u-row" style="margin-bottom:.5cqw"><span class="u-pill" style="background:#dbeafe;color:#1d4ed8">BEGINNER</span><span class="u-pill" style="background:#dcfce7;color:#15803d">QUIZ</span><span class="u-pill" style="background:#dcfce7;color:#15803d;margin-left:auto">86%</span></div><div style="font-size:1.5cqw;font-family:'Baloo 2'">Say Nice to Meet you</div><div class="u-bar"><i style="--p:100%;--c:#31c27c"></i></div>${row("100% completed", "2 steps")}<div class="u-row" style="margin-top:.7cqw"><div class="u-btn" style="background:#31c27c;color:#fff">Review</div><div class="u-btn" style="background:#e6f0ff;color:#1d4ed8">Attempts</div></div>`,
